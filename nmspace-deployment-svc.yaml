## NameSpace

apiVersion: v1
kind: Namespace
metadata:
  name: dev
  labels:
    env: dev
---
## Deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  labels:
    app: nginx-deployment
  namespace: dev
spec:
  replicas: 10
  selector:
    matchLabels:
      app: nginx-pod
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: nginx-pod
    spec:
      containers:
        - image: nginx
          name: my-cont
          ports:
            - containerPort: 80
---
## service

apiVersion: v1
kind: Service
metadata:
  name: my-svc
  labels:
    app: nginx-svc
  namespace: dev
spec:
  type: NodePort
  selector:
    app: nginx-pod
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32100
      protocol: TCP

